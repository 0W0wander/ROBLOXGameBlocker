<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 340px;
      padding: 12px;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }
    h3 {
      margin: 0 0 12px 0;
      color: #00d4aa;
      font-weight: 600;
      border-bottom: 2px solid #00d4aa;
      padding-bottom: 8px;
    }
    h4 {
      margin: 12px 0 8px 0;
      color: #888;
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    /* Tabs */
    .tabs {
      display: flex;
      margin-bottom: 12px;
      border-radius: 6px;
      overflow: hidden;
      background: #16213e;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #888;
      font-size: 0.9em;
      transition: all 0.2s;
    }
    .tab:hover {
      background: #1f3460;
      color: #ccc;
    }
    .tab.active {
      background: #00d4aa;
      color: #1a1a2e;
      font-weight: 600;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    
    /* Search & Inputs */
    #search-input, #keyword-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      box-sizing: border-box;
      background: #16213e;
      color: #eee;
      font-size: 0.9em;
    }
    #search-input:focus, #keyword-input:focus {
      outline: none;
      border-color: #00d4aa;
    }
    #search-input::placeholder, #keyword-input::placeholder {
      color: #666;
    }
    
    /* Keyword Builder Section */
    .keyword-builder {
      background: #16213e;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .keyword-builder-label {
      color: #888;
      font-size: 0.75em;
      margin-bottom: 8px;
      display: block;
    }
    .keyword-builder-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .keyword-builder-input-row input {
      flex: 1;
    }
    #add-word-btn {
      background: #2a2a4a;
      color: #00d4aa;
      border: 1px solid #00d4aa;
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.85em;
      transition: all 0.2s;
      white-space: nowrap;
    }
    #add-word-btn:hover {
      background: #00d4aa;
      color: #1a1a2e;
    }
    
    /* Current keyset preview */
    .current-keyset {
      min-height: 32px;
      background: #0f0f1e;
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .current-keyset-empty {
      color: #666;
      font-style: italic;
      font-size: 0.8em;
    }
    .current-word {
      display: inline-flex;
      align-items: center;
      background: #f39c12;
      color: #1a1a2e;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.8em;
      font-weight: 600;
    }
    .current-word .remove-word {
      margin-left: 6px;
      cursor: pointer;
      font-weight: bold;
      opacity: 0.7;
    }
    .current-word .remove-word:hover {
      opacity: 1;
    }
    .keyset-plus {
      color: #f39c12;
      font-weight: bold;
      font-size: 0.9em;
    }
    
    #save-keyset-btn {
      width: 100%;
      background: #00d4aa;
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    #save-keyset-btn:hover {
      background: #00b894;
    }
    #save-keyset-btn:disabled {
      background: #2a2a4a;
      color: #666;
      cursor: not-allowed;
    }
    
    /* Game/Keyword Items */
    .blocked-game, .keyword-rule {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      margin: 6px 0;
      background: #16213e;
      border-radius: 6px;
      border-left: 3px solid #e74c3c;
      word-break: break-word;
      transition: all 0.2s;
    }
    .blocked-game:hover, .keyword-rule:hover {
      background: #1f3460;
    }
    .keyword-rule {
      border-left-color: #f39c12;
    }
    .blocked-game span, .keyword-rule span {
      margin-right: 10px;
      flex: 1;
      font-size: 0.9em;
    }
    .blocked-game small, .keyword-rule small {
      color: #666;
      font-size: 0.75em;
      display: block;
      margin-top: 2px;
    }
    .keyword-tag {
      display: inline-block;
      background: #f39c12;
      color: #1a1a2e;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75em;
      font-weight: 600;
      margin-right: 4px;
    }
    
    /* Remove Button */
    .remove-btn {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.8em;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .remove-btn:hover {
      background: #c0392b;
      transform: scale(1.05);
    }
    
    /* Button Container */
    .button-container {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #2a2a4a;
    }
    .action-btn {
      background: #16213e;
      color: #00d4aa;
      border: 1px solid #00d4aa;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.85em;
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: #00d4aa;
      color: #1a1a2e;
    }
    #import-input {
      display: none;
    }
    
    /* Stats */
    .total-count {
      color: #666;
      font-size: 0.85em;
      text-align: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #2a2a4a;
    }
    
    .no-items {
      color: #666;
      font-style: italic;
      font-size: 0.85em;
      padding: 8px 0;
    }
    
    /* Empty State */
    #blocked-list p, #keyword-list p {
      color: #666;
      font-style: italic;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <h3>Roblox Game Blocker</h3>
  
  <div class="tabs">
    <button class="tab active" data-tab="games">Blocked Games</button>
    <button class="tab" data-tab="keywords">Keywords</button>
  </div>
  
  <!-- Blocked Games Tab -->
  <div id="games-tab" class="tab-content active">
    <div id="search-container">
      <input type="text" id="search-input" placeholder="Search blocked games...">
    </div>
    <div id="blocked-list"></div>
  </div>
  
  <!-- Keywords Tab -->
  <div id="keywords-tab" class="tab-content">
    <div class="keyword-builder">
      <span class="keyword-builder-label">Type a word and press Enter to add it. Games must contain ALL words to be blocked.</span>
      <div class="keyword-builder-input-row">
        <input type="text" id="keyword-input" placeholder="Type a keyword...">
        <button id="add-word-btn">+ Add</button>
      </div>
      <div class="current-keyset" id="current-keyset">
        <span class="current-keyset-empty">No keywords yet</span>
      </div>
      <button id="save-keyset-btn" disabled>Save Keyset</button>
    </div>
    
    <h4>Active Keyword Rules</h4>
    <div id="keyword-list"></div>
  </div>
  
  <div class="button-container">
    <button id="export-btn" class="action-btn">Export</button>
    <input type="file" id="import-input" accept=".json">
    <button id="import-btn" class="action-btn">Import</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
